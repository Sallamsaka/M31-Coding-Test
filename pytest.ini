[pytest]
testpaths = tests
markers =
    slow: refits a model; minutes rather than seconds
filterwarnings =
    ignore::FutureWarning:sklearn.linear_model._logistic
    ignore::RuntimeWarning:numpy
# The sklearn FutureWarning is `penalty='l2'` being retired in favour of
# `l1_ratio=0`. It is suppressed rather than fixed on purpose: every number in
# the report was measured with the current parameterisation, and swapping it
# mid-project would silently re-baseline the results for a cosmetic gain.
# Revisit when pinning to a version that removes it.
